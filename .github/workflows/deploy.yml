name: CD - deploy source schema

# Runs after changes land on main (PRs must pass CI first: protect the branch).
on:
  push:
    branches: [main]
    paths: ["source/sql/migrations/**", "source/migrate.py"]
  workflow_dispatch:

concurrency:
  group: azure-sql-source      # never overlaps the daily increment
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production     # add required reviewers in Settings > Environments for a manual gate
    env:
      AZURE_SQL_CONN: ${{ secrets.AZURE_SQL_ADMIN_CONN }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-mssql
      - name: Pending migrations
        run: python migrate.py status
      - name: Apply
        run: python migrate.py apply
